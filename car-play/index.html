<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f1e7">
<title>부릉부릉 놀이터</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f6f1e7; color: #183b35; font: 1rem system-ui,sans-serif }
main { width: min(100%, 650px); margin: auto; padding: clamp(10px, 3vw, 22px) }
h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 8px }
#scene { position: relative; width: 100%; height: clamp(155px, 62dvh, 610px); overflow: hidden; border-radius: 20px; background: #abc78f }
#street { display: block; width: 100%; height: 100% }
#cue { position: absolute; margin: 0; top: 10px; left: 10px; background: #fffdfa; border-radius: 10px; padding: 6px 11px; font-size: clamp(1rem, 4vw, 1.3rem); font-weight: 800 }
.moving #cue { background: #20564b; color: white }
button, select { font: inherit; color: inherit }
button:focus-visible, select:focus-visible { outline: 3px solid #9b420d; outline-offset: 3px }
#mic { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); min-width: 138px; min-height: 56px; padding: 8px 22px; border: 2px solid #fffdfa; border-radius: 15px; background: #20564b; color: white; font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 800; cursor: pointer; touch-action: manipulation }
#mic[aria-pressed="true"] { left: auto; top: auto; right: 10px; bottom: 10px; transform: none; min-width: 0; min-height: 44px; padding: 7px 10px; background: #e1e8dd; color: #183b35; font-size: .9rem }
#mic-status { margin: 6px 0; min-height: 1.35em; font-size: .88rem }
#mic-options { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; font-size: .88rem }
#mic-options[hidden] { display: none }
select { min-height: 36px; background: #fffdfa; border: 1px solid #b7c9bd; border-radius: 8px }
details { margin-top: 5px; font-size: .86rem; line-height: 1.5 }
details p { margin: 4px 0 }
@media (max-height: 480px) and (orientation: landscape) {
  #scene { height: 47dvh }
  #mic { min-height: 44px }
}
.choices { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 8px }
.choice-group { display: flex; gap: 5px; align-items: center }
.choice-group button { min-height: 44px; min-width: 44px; padding: 4px 9px; border-radius: 10px; border: 1px solid #a9bdb2; background: #fffdfa; font-weight: 750; cursor: pointer; touch-action: manipulation }
.choice-group button[aria-pressed="true"] { border-color: #20564b; box-shadow: inset 0 0 0 2px #20564b }
.scenes button[aria-pressed="true"] { background: #20564b; color: white }
.paint button { display: grid; place-items: center; padding: 4px }
.paint span { width: 23px; height: 23px; border-radius: 50%; border: 1px solid #183b3550; background: var(--swatch) }
.paint button[aria-pressed="true"] span::after { content: '✓'; display: grid; place-items: center; height: 100%; color: var(--check, white); font-size: .9rem }
@media (max-width: 480px) { #scene { height: clamp(155px, 49dvh, 480px) } }
#mic[aria-pressed="false"] { width: 84px; height: 84px; min-width: 0; padding: 0; border-radius: 50%; background: #c72c32; }
@media (max-height: 480px) and (orientation: landscape) { #mic[aria-pressed="false"] { width: 64px; height: 64px; } }
[hidden] { display: none !important }
.activity-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 9px }
.activity-tabs button { min-height: 44px; padding: 6px 10px; border-radius: 12px; border: 1px solid #a9bdb2; background: #fffdfa; font-weight: 750; cursor: pointer; touch-action: manipulation }
.activity-tabs button[aria-pressed="true"] { background: #20564b; border-color: #20564b; color: white }
#sort-panel { min-height: min(54dvh, 430px); padding: clamp(12px, 3vw, 24px); background: #fffdfa; border: 1px solid #dedbcc; border-radius: 20px; text-align: center }
#sort-status { min-height: 2.8em; margin: 0; font-size: clamp(1rem, 4vw, 1.24rem); font-weight: 750 }
.sort-car-space { display: grid; place-items: center; height: clamp(96px, 18dvh, 145px) }
#sort-car { touch-action: none; cursor: grab; user-select: none; display: block; width: 145px; height: 86px; position: relative; z-index: 1; overflow: visible }
#sort-car.dragging { cursor: grabbing }
.basket.drop-target { outline: 3px solid var(--rim); outline-offset: 2px }
.sort-car-body { position: absolute; inset: 8px 5px 20px; background: var(--car-paint, #bf3a34); border-radius: 16px; clip-path: polygon(0 51%, 9% 40%, 24% 34%, 40% 0, 69% 0, 84% 36%, 100% 52%, 100% 100%, 0 100%) }
.sort-car-window { position: absolute; inset: 6px 30px auto 43px; height: 17px; background: linear-gradient(90deg, #d8edf9 0 46%, transparent 46% 53%, #d8edf9 53%); clip-path: polygon(0 100%, 25% 0, 74% 0, 100% 100%) }
.sort-wheel { position: absolute; top: 53px; width: 25px; height: 25px; border-radius: 50%; background: radial-gradient(circle, #c8d6d4 27%, #273234 30%) }
.sort-wheel-front { right: 19px }
.sort-wheel-back { left: 21px }
.baskets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(8px, 3vw, 25px); max-width: 450px; margin: 0 auto }
.basket { display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 112px; padding: 9px 4px; background: var(--pale); border: 2px solid var(--rim); border-radius: 16px; color: #25363a; font-weight: 800; cursor: pointer; touch-action: manipulation }
.basket:active { scale: .98 }
.basket-red { --pale: #fff0ed; --rim: #a82c30; --bin: #d94245 }
.basket-blue { --pale: #eaf3ff; --rim: #1d5493; --bin: #377bc4 }
.basket-shape { position: relative; display: block; width: min(90%, 125px); height: 56px; isolation: isolate }
.basket-shape::before { content: ""; position: absolute; inset: 12px 0 0; border-radius: 8px 8px 14px 14px; background: var(--rim); clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%) }
.basket-shape::after { content: ""; position: absolute; z-index: 2; inset: 33px 5% 0; border-top: 3px solid var(--rim); border-radius: 0 0 12px 12px; background: repeating-linear-gradient(90deg, var(--bin) 0 10px, var(--rim) 10px 12px); clip-path: polygon(0 0, 100% 0, 91% 100%, 9% 100%) }
.basket-cars { position: absolute; z-index: 1; top: 18px; inset-inline: 10%; display: flex; justify-content: center; gap: 2px }
.basket-car { width: min(31%, 28px); height: 21px; background: var(--mini-paint); border-radius: 3px; clip-path: polygon(0 50%, 23% 42%, 41% 0, 71% 0, 86% 39%, 100% 55%, 100% 90%, 0 90%); animation: settle-car 210ms ease-out both }
.basket-car::after { content: ""; display: block; margin: 3px auto 0; width: 37%; height: 6px; background: #e5f5f8; border-radius: 2px }
.basket-count { color: #354d48; font-size: .8rem; line-height: 1 }
@keyframes settle-car { from { transform: translateY(-8px) } to { transform: translateY(0) } }
@media (prefers-reduced-motion: reduce) { .basket-car { animation: none } }
</style>
</head>
<body>
<main>
  <h1>부릉부릉 놀이터</h1>
  <nav class="activity-tabs" aria-label="놀이 고르기">
    <button type="button" data-activity="drive" aria-controls="drive-panel" aria-pressed="true">소리로 달리기</button>
    <button type="button" data-activity="sort" aria-controls="sort-panel" aria-pressed="false">색깔 분류</button>
  </nav>
  <section id="drive-panel" aria-label="소리로 달리기">
  <div class="choices">
    <div class="choice-group scenes" role="group" aria-label="장소 고르기">
      <button type="button" data-world="city" aria-pressed="true">도시</button>
      <button type="button" data-world="beach" aria-pressed="false">바닷가</button>
      <button type="button" data-world="space" aria-pressed="false">우주</button>
    </div>
    <div class="choice-group paint" role="group" aria-label="탈것 색깔 고르기">
      <button type="button" data-paint="red" aria-label="빨강" aria-pressed="true"><span aria-hidden="true" style="--swatch:#bf3a34"></span></button>
      <button type="button" data-paint="blue" aria-label="파랑" aria-pressed="false"><span aria-hidden="true" style="--swatch:#266bb8"></span></button>
      <button type="button" data-paint="yellow" aria-label="노랑" aria-pressed="false"><span aria-hidden="true" style="--swatch:#ffc540;--check:#382b16"></span></button>
      <button type="button" data-paint="purple" aria-label="보라" aria-pressed="false"><span aria-hidden="true" style="--swatch:#854eaa"></span></button>
    </div>
  </div>
  <div id="scene">
    <canvas id="street" role="img" aria-label="도시의 세로 도로를 달리는 자동차"></canvas>
    <p id="cue">시작 버튼을 눌러요</p>
    <button id="mic" type="button" aria-pressed="false">시작</button>
  </div>
  <p id="mic-status" role="status">시작하면 마이크로 소리를 들어요.</p>
  <label id="mic-options" hidden>민감도
    <select id="mic-sensitivity">
      <option value="0.028">낮게</option>
      <option value="0.015" selected>보통</option>
      <option value="0.008">높게</option>
    </select>
  </label>
  <details>
    <summary>함께 노는 방법</summary>
    <p>시작을 누르고 마이크 사용을 허용해 주세요. “아”, “으”처럼 편한 소리를 내 보세요. 소리가 들리면 탈것이 앞으로 가고, 조용해지면 그 자리에 멈춰요.</p>
    <p>주변 소리에도 반응할 수 있어요. 마이크 입력은 이 기기에서 소리 크기를 확인하는 데만 쓰고 녹음하거나 전송하지 않아요.</p>
  </details>
  </section>
  <section id="sort-panel" aria-label="색깔 분류" hidden>
    <p id="sort-status" role="status">자동차를 같은 색 바구니로 끌어다 놓아요.</p>
    <div class="sort-car-space">
      <div id="sort-car" role="img" aria-label="빨간 자동차">
        <div class="sort-car-body" aria-hidden="true"><div class="sort-car-window"></div></div>
        <span class="sort-wheel sort-wheel-front" aria-hidden="true"></span>
        <span class="sort-wheel sort-wheel-back" aria-hidden="true"></span>
      </div>
    </div>
    <div class="baskets" role="group" aria-label="바구니 고르기">
      <button type="button" class="basket basket-red" data-basket="red">
        <span class="basket-shape" aria-hidden="true"><span class="basket-cars"></span></span>
        <span class="basket-name">빨간 바구니</span>
        <span class="basket-count" hidden></span>
      </button>
      <button type="button" class="basket basket-blue" data-basket="blue">
        <span class="basket-shape" aria-hidden="true"><span class="basket-cars"></span></span>
        <span class="basket-name">파란 바구니</span>
        <span class="basket-count" hidden></span>
      </button>
    </div>
  </section>
</main>
<script>
const scene = document.querySelector('#scene');
const street = document.querySelector('#street');
const cue = document.querySelector('#cue');
const pen = street.getContext('2d');
const buildings = [
  { roof: '#d77856', wall: '#f4c6a3', width: 0.85, height: 55 },
  { roof: '#527d93', wall: '#b9d5df', width: 0.66, height: 66 },
  { roof: '#9478a9', wall: '#e1caea', width: 0.92, height: 49 },
  { roof: '#a97942', wall: '#f6da9f', width: 0.74, height: 59 }
];
const worlds = {
  city: { label: '도시의 세로 도로를 달리는 자동차', sound: '부우웅!' },
  beach: { label: '바닷가 모랫길을 달리는 자동차', sound: '부우웅!' },
  space: { label: '별과 행성 사이를 위로 날아가는 우주선', sound: '슈우웅!' }
};
const colors = {
  red: { body: '#bf3a34', edge: '#861f22' },
  blue: { body: '#266bb8', edge: '#174274' },
  yellow: { body: '#ffc540', edge: '#a46411' },
  purple: { body: '#854eaa', edge: '#54346c' }
};
let world = 'city';
let paint = colors.red;
let width = 0;
let height = 0;

function block(color, x, y, w, h) {
  pen.fillStyle = color;
  pen.fillRect(x, y, w, h);
}

function drawBuilding(edge, y, span, building, leftSide) {
  const w = span * building.width;
  const x = leftSide ? edge - w : edge;
  const h = building.height;
  block('#00000024', x + 4, y + 6, w, h);
  block(building.wall, x, y + 9, w, h - 9);
  block(building.roof, x, y, w, 20);
  for (let i = 1; i <= 3; i++) {
    block('#314e55', x + w * i / 4 - w * 0.06, y + 27, w * 0.12, 10);
  }
  block('#526061', x + w * 0.42, y + h - 11, w * 0.16, 11);
}

function circle(color, x, y, radius) {
  pen.fillStyle = color;
  pen.beginPath();
  pen.arc(x, y, radius, 0, Math.PI * 2);
  pen.fill();
}

function wrap(value, period) {
  return ((value % period) + period) % period;
}

function drawBeach(scroll) {
  block('#efd7a1', 0, 0, width, height);
  block('#e5ba76', width * 0.31, 0, width * 0.37, height);
  block('#76d4c9', width * 0.72, 0, width * 0.28, height);
  block('#45aeb9', width * 0.8, 0, width * 0.2, height);

  for (let y = scroll % 82 - 82; y < height; y += 82) {
    block('#e0fbdf', width * 0.73, y, width * 0.12, 3);
    block('#a3ece1', width * 0.85, y + 32, width * 0.1, 3);
    block('#d3a96a', width * 0.34, y + 20, 12, 2);
  }

  const stride = 125;
  for (let row = -1; row * stride + scroll % stride < height; row++) {
    const y = row * stride + scroll % stride;
    const x = width * 0.17;
    const index = wrap(row - Math.floor(scroll / stride), 3);
    const towel = ['#e88061', '#69a99d', '#b189b6'][index];
    block('#fff7dd', x - 14, y + 20, 28, 34);
    block(towel, x - 9, y + 24, 18, 26);
    circle('#b58e65', x + 4, y + 8, 19);
    circle(towel, x, y + 4, 19);
    circle('#fff7dd', x, y + 4, 8);
  }
}

function drawSpace(scroll) {
  block('#1b2145', 0, 0, width, height);
  const period = height + 150;
  for (let i = 0; i < 40; i++) {
    const x = (i * 73 % 197) / 197 * width;
    const y = wrap(i * 47 + scroll * 0.6, period) - 65;
    const size = i % 5 === 0 ? 4 : 2;
    block(i % 3 === 0 ? '#f9da9e' : '#b7c5ef', x, y, size, size);
  }

  const planetSize = Math.min(32, width * 0.085);
  const first = wrap(85 + scroll * 0.85, period) - 55;
  const second = wrap(period * 0.62 + scroll * 0.85, period) - 55;
  circle('#f0b180', width * 0.18, first, planetSize);
  circle('#ffe0a9', width * 0.18 - planetSize * 0.3, first - 5, planetSize * 0.45);
  circle('#826fbe', width * 0.82, second, planetSize * 0.8);
  block('#d3acf3', width * 0.82 - planetSize, second + 2, planetSize * 2, 4);
}

function drawRocket() {
  if (scene.classList.contains('moving')) {
    pen.fillStyle = '#ffb95c';
    pen.beginPath();
    pen.moveTo(-8, 24);
    pen.lineTo(0, 43);
    pen.lineTo(8, 24);
    pen.fill();
    circle('#ffedaa', 0, 27, 5);
  }
  pen.fillStyle = paint.edge;
  pen.beginPath();
  pen.moveTo(-10, 0);
  pen.lineTo(-23, 25);
  pen.lineTo(23, 25);
  pen.lineTo(10, 0);
  pen.closePath();
  pen.fill();
  pen.fillStyle = paint.body;
  pen.beginPath();
  pen.moveTo(0, -39);
  pen.quadraticCurveTo(25, -14, 12, 26);
  pen.lineTo(-12, 26);
  pen.quadraticCurveTo(-25, -14, 0, -39);
  pen.fill();
  circle('#20365a', 0, -7, 10);
  circle('#bde5f4', 0, -7, 7);
  circle('#effbff', -2, -9, 2);
}

function drawCity(scroll) {
  const mid = width / 2;
  const road = width * 0.38;
  const left = mid - road / 2;
  const right = mid + road / 2;
  const span = Math.min(left - 15, 130);
  block('#abc78f', 0, 0, width, height);
  block('#f0e2cb', left - 7, 0, road + 14, height);
  block('#495658', left, 0, road, height);

  for (let y = scroll % 65 - 65; y < height; y += 65) {
    block('#fff0cb', mid - 2, y, 4, 27);
  }

  const stride = 103;
  const shift = scroll % stride;
  const passed = Math.floor(scroll / stride);
  for (let row = -1; row * stride + shift < height; row++) {
    const index = ((row - passed) % buildings.length + buildings.length) % buildings.length;
    const y = row * stride + shift;
    drawBuilding(left - 12, y + 5, span, buildings[index], true);
    drawBuilding(right + 12, y + 28, span, buildings[(index + 2) % buildings.length], false);
  }

}

function drawStreet() {
  const approach = Math.min(distance, height * 0.23);
  const scroll = distance - approach;
  if (world === 'city') drawCity(scroll);
  if (world === 'beach') drawBeach(scroll);
  if (world === 'space') drawSpace(scroll);

  const carY = height * 0.76 - approach;
  pen.save();
  pen.translate(width / 2, carY);
  const scale = Math.min(1.22, width / 330, height / 280);
  pen.scale(scale, scale);
  if (world === 'space') drawRocket();
  else drawCar();
  pen.restore();
}

function drawCar() {
  block('#00000035', -17, -29, 39, 69);
  for (const x of [-23, 17]) {
    block('#273234', x, -25, 6, 15);
    block('#273234', x, 15, 6, 15);
  }
  pen.fillStyle = paint.body;
  pen.beginPath();
  pen.roundRect(-19, -35, 38, 70, 9);
  pen.fill();
  block('#ffe7a2', -15, -31, 9, 5);
  block('#ffe7a2', 6, -31, 9, 5);
  block('#cce4e9', -13, -18, 26, 13);
  block('#8bb5c0', -13, 12, 26, 11);
  block(paint.edge, -16, 29, 8, 4);
  block(paint.edge, 8, 29, 8, 4);
}

function resizeStreet() {
  width = street.clientWidth;
  height = street.clientHeight;
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  street.width = Math.round(width * ratio);
  street.height = Math.round(height * ratio);
  pen.setTransform(ratio, 0, 0, ratio, 0, 0);
  drawStreet();
}
const micButton = document.querySelector('#mic');
const micStatus = document.querySelector('#mic-status');
const micOptions = document.querySelector('#mic-options');
const sensitivity = document.querySelector('#mic-sensitivity');
let micState = 'off';
let micRequest = 0;
let micStream;
let micContext;
let micFrame;
let distance = 0;

function showMicState(state, message) {
  micState = state;
  scene.classList.remove('moving');
  drawStreet();
  micButton.setAttribute('aria-pressed', String(state === 'on'));
  micButton.textContent = { off: '시작', starting: '취소', on: '놀이 멈추기' }[state];
  micOptions.hidden = state !== 'on';
  micStatus.textContent = message;
  cue.textContent = { off: '시작 버튼을 눌러요', starting: '시작 준비 중', on: '소리를 내 봐요!' }[state];
}

function stopMicrophone(message = '다시 놀려면 시작을 눌러요.') {
  micRequest++;
  cancelAnimationFrame(micFrame);
  micStream?.getTracks().forEach(track => track.stop());
  micContext?.close().catch(() => {});
  micStream = undefined;
  micContext = undefined;
  showMicState('off', message);
}

function listen(analyser) {
  const samples = new Float32Array(analyser.fftSize);
  let loudSince;
  let lastSound;
  let previousTime;
  let moving = false;

  function readFrame(now) {
    const elapsed = Math.min(now - (previousTime ?? now), 50);
    previousTime = now;
    analyser.getFloatTimeDomainData(samples);
    let energy = 0;
    for (const sample of samples) energy += sample * sample;
    const audible = Math.sqrt(energy / samples.length) >= Number(sensitivity.value);

    if (audible) {
      loudSince ??= now;
      lastSound = now;
    } else {
      loudSince = undefined;
    }

    const driving = audible && now - loudSince >= 32
      || moving && lastSound !== undefined && now - lastSound < 85;
    if (driving !== moving) {
      moving = driving;
      scene.classList.toggle('moving', moving);
      cue.textContent = moving ? worlds[world].sound : '소리를 내 봐요!';
      if (!moving) drawStreet();
    }
    if (moving) {
      distance += elapsed * 0.34;
      drawStreet();
    }
    micFrame = requestAnimationFrame(readFrame);
  }
  micFrame = requestAnimationFrame(readFrame);
}

async function startMicrophone() {
  const Engine = window.AudioContext || window.webkitAudioContext;
  if (!navigator.mediaDevices?.getUserMedia || !Engine) {
    showMicState('off', '이 환경에서는 마이크를 쓸 수 없어요. HTTPS로 열린 브라우저에서 다시 시도해 주세요.');
    return;
  }

  const request = ++micRequest;
  showMicState('starting', '브라우저에서 마이크 권한을 허용해 주세요.');
  try {
    const context = new Engine();
    micContext = context;
    const resumed = context.resume().catch(() => {});
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false },
      video: false
    });
    if (request !== micRequest) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    micStream = stream;
    await resumed;
    if (request !== micRequest) return;
    if (context.state !== 'running') throw new Error('Audio processing unavailable');

    const analyser = context.createAnalyser();
    analyser.fftSize = 1024;
    context.createMediaStreamSource(stream).connect(analyser);
    stream.getAudioTracks().forEach(track => track.addEventListener('ended', () => {
      stopMicrophone('마이크 연결이 끊겼어요. 다시 시작할 수 있어요.');
    }));
    showMicState('on', '듣고 있어요. 소리를 내면 앞으로 가요.');
    listen(analyser);
  } catch (error) {
    if (request !== micRequest) return;
    stopMicrophone(error.name === 'NotAllowedError'
      ? '마이크 권한을 허용하면 소리에 반응해요.'
      : '마이크를 시작할 수 없어요. 연결을 확인하고 시작을 다시 눌러 주세요.');
  }
}

micButton.addEventListener('click', () => {
  if (micState === 'off') void startMicrophone();
  else stopMicrophone();
});
window.addEventListener('pagehide', () => stopMicrophone());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && micState !== 'off') stopMicrophone();
});

const worldButtons = document.querySelectorAll('[data-world]');
const paintButtons = document.querySelectorAll('[data-paint]');
for (const button of worldButtons) {
  button.addEventListener('click', () => {
    world = button.dataset.world;
    for (const option of worldButtons) option.setAttribute('aria-pressed', String(option === button));
    street.setAttribute('aria-label', worlds[world].label);
    if (scene.classList.contains('moving')) cue.textContent = worlds[world].sound;
    drawStreet();
  });
}
for (const button of paintButtons) {
  button.addEventListener('click', () => {
    paint = colors[button.dataset.paint];
    for (const option of paintButtons) option.setAttribute('aria-pressed', String(option === button));
    drawStreet();
  });
}

const drivePanel = document.querySelector('#drive-panel');
const sortPanel = document.querySelector('#sort-panel');
const activityButtons = document.querySelectorAll('[data-activity]');
const basketButtons = document.querySelectorAll('[data-basket]');
const sortCar = document.querySelector('#sort-car');
const sortStatus = document.querySelector('#sort-status');
const sortNames = { red: '빨간 자동차', blue: '파란 자동차' };
const sortSequence = ['red', 'blue', 'blue', 'red'];
let sortTurn = 0;
let sortAnimation;
const sortedCounts = { red: 0, blue: 0 };

function finishSortDrop(basket) {
  const color = basket.dataset.basket;
  const count = ++sortedCounts[color];
  const cars = basket.querySelector('.basket-cars');
  if (cars.childElementCount < 3) {
    const car = document.createElement('span');
    car.className = 'basket-car';
    car.style.setProperty('--mini-paint', colors[color].body);
    cars.append(car);
  }
  const counter = basket.querySelector('.basket-count');
  counter.textContent = count + '대';
  counter.hidden = false;
  nextSortCar();
}

function nextSortCar() {
  sortTurn = (sortTurn + 1) % sortSequence.length;
  const sortColor = sortSequence[sortTurn];
  sortCar.style.setProperty('--car-paint', colors[sortColor].body);
  sortCar.setAttribute('aria-label', sortNames[sortColor]);
  sortStatus.textContent = '잘 넣었어요! 다음 자동차도 끌어다 놓아요.';
}

let drag;

function clearDrag() {
  if (!drag) return;
  const pointer = drag.pointer;
  drag = undefined;
  sortCar.classList.remove('dragging');
  for (const basket of basketButtons) basket.classList.remove('drop-target');
  if (sortCar.hasPointerCapture(pointer)) sortCar.releasePointerCapture(pointer);
}

function basketAt(x, y) {
  return Array.from(basketButtons).find(basket => {
    const rect = basket.getBoundingClientRect();
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  });
}

async function placeSortCar(basket, x = 0, y = 0) {
  const correct = basket?.dataset.basket === sortSequence[sortTurn];
  if (!correct) sortStatus.textContent = '자동차와 같은 색 바구니에 넣어봐요.';
  if (!sortCar.animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    sortCar.style.transform = '';
    if (correct) finishSortDrop(basket);
    return;
  }

  const from = 'translate(' + x + 'px, ' + y + 'px)';
  const keyframes = [{ transform: from, opacity: 1 }];
  if (correct) {
    const car = sortCar.getBoundingClientRect();
    const bin = basket.querySelector('.basket-shape').getBoundingClientRect();
    const targetX = x + bin.left + (bin.width - car.width) / 2 - car.left;
    const targetY = y + bin.top + (bin.height - car.height) / 2 - car.top;
    keyframes.push(
      { transform: 'translate(' + targetX + 'px, ' + (targetY - 17) + 'px) scale(.42)', opacity: 1, offset: .68 },
      { transform: 'translate(' + targetX + 'px, ' + (targetY + 8) + 'px) scale(.2)', opacity: 0 }
    );
  } else {
    keyframes.push({ transform: 'translate(0, 0)', opacity: 1 });
  }
  const animation = sortCar.animate(keyframes, { duration: correct ? 350 : 220, easing: 'ease-out' });
  sortAnimation = animation;
  try {
    await animation.finished;
    if (correct) finishSortDrop(basket);
  } catch {
    // Switching activities cancels the current movement.
  } finally {
    if (sortAnimation === animation) {
      sortCar.style.transform = '';
      sortAnimation = undefined;
    }
  }
}

sortCar.addEventListener('pointerdown', event => {
  if (drag || sortAnimation || event.button !== 0) return;
  drag = { pointer: event.pointerId, startX: event.clientX, startY: event.clientY };
  sortCar.setPointerCapture(event.pointerId);
  sortCar.classList.add('dragging');
});

sortCar.addEventListener('pointermove', event => {
  if (drag?.pointer !== event.pointerId) return;
  const x = event.clientX - drag.startX;
  const y = event.clientY - drag.startY;
  sortCar.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
  const target = basketAt(event.clientX, event.clientY);
  for (const basket of basketButtons) basket.classList.toggle('drop-target', basket === target);
});

sortCar.addEventListener('pointerup', event => {
  if (drag?.pointer !== event.pointerId) return;
  const x = event.clientX - drag.startX;
  const y = event.clientY - drag.startY;
  sortCar.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
  const target = basketAt(event.clientX, event.clientY);
  clearDrag();
  void placeSortCar(target, x, y);
});

function cancelSortDrag(event) {
  if (drag?.pointer !== event.pointerId) return;
  clearDrag();
  sortCar.style.transform = '';
}

sortCar.addEventListener('pointercancel', cancelSortDrag);
sortCar.addEventListener('lostpointercapture', cancelSortDrag);

for (const basket of basketButtons) {
  basket.addEventListener('click', event => {
    if (event.detail === 0 && !drag && !sortAnimation) void placeSortCar(basket);
  });
}

for (const button of activityButtons) {
  button.addEventListener('click', () => {
    const sorting = button.dataset.activity === 'sort';
    if (sorting && micState !== 'off') stopMicrophone();
    if (!sorting) {
      clearDrag();
      sortAnimation?.cancel();
      sortCar.style.transform = '';
    }
    sortPanel.hidden = !sorting;
    drivePanel.hidden = sorting;
    for (const option of activityButtons) option.setAttribute('aria-pressed', String(option === button));
    if (!sorting) resizeStreet();
  });
}

window.addEventListener('resize', () => {
  if (!drivePanel.hidden) resizeStreet();
});
resizeStreet();
</script>
